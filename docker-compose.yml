services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: inventory_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: QWERTY
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_app"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "3000:3000"
    env_file: 
     - .env
    environment:
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: QWERTY
      DB_NAME: inventory_app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
