services:
  db:
    image: postgres:16
    env_file:
      - .env.prod
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: 
      context: .
      target: prod
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      DB_HOST: db
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:${DB_PORT}/${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
    command: 
      npm run start
   

volumes:
  postgres_data:
