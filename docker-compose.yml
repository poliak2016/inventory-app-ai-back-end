services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16
    env_file:
      - .env.prod
    environment:
      POSTGRES_DB: ${DB_NAME:-inventory_app}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-inventory_app}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: 
      context: .
      target: prod
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      DB_HOST: db
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-}@db:${DB_PORT:-5432}/${DB_NAME:-inventory_app}
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: 
      npm run start
   

volumes:
  postgres_data:
