services:

  redis:
    image: redis:7-alpine
    healthcheck: 
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  db:
    image: postgres:16
    env_file:
      - .env.docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_app"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: 
      context: .
    env_file:
      - .env.docker
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
      redis: 
        condition: service_healthy
   

volumes:
  postgres_data:
