services:
  db:
    image: postgres:16
    env_file:
      - .env.docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-inventory_app}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: 
      context: .
      target: prod
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env.dev
    environment:
      NODE_ENV: production
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    command: 
      npm run start
   

volumes:
  postgres_data:
