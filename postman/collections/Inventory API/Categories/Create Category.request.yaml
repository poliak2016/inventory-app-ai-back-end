$kind: http-request
name: Create Category
method: POST
url: '{{baseUrl}}/api/categories'
order: 1000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{accessToken}}'
body:
  type: json
  content: |-
    {
      "name": "Beverages"
    }
