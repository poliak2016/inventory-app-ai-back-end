$kind: http-request
name: Create Product
method: POST
url: "{{baseUrl}}/api/products"
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 3000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Sample Product",
      "price": 19.99,
      "quantity": 10,
      "categoryId": "4fdcb718-0192-4153-ab36-41c869d78337"
    }
