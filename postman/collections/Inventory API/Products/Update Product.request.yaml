$kind: http-request
method: PUT
url: '{{baseUrl}}/api/products/{{productId}}'
order: 4000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Updated Product",
      "price": 29.99,
      "quantity": 15
    }
