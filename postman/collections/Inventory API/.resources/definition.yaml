$kind: collection
name: Inventory API
variables:
  baseUrl: ""
  accessToken: ""
  password: ""
  tokenExpiry: ""
  email: ""
  token: ""
scripts:
  - type: http:beforeRequest
    code: "const tokenExpiry = pm.collectionVariables.get('tokenExpiry')\r

      const token = pm.collectionVariables.get('token')\r

      const now = Date.now()\r

      \r

      if (!token || !tokenExpiry || now >= Number(tokenExpiry)) {\r

      \  pm.sendRequest({\r

      \    url: pm.collectionVariables.get('baseUrl') + '/api/auth/login',\r

      \    method: 'POST',\r

      \    header: { 'Content-Type': 'application/json' },\r

      \    body: {\r

      \      mode: 'raw',\r

      \      raw: JSON.stringify({\r

      \        email: pm.collectionVariables.get('email'),\r

      \        password: pm.collectionVariables.get('password')\r

      \      })\r

      \    }\r

      \  }, (err, res) => {\r

      \    if (err) { console.error(err); return }\r

      \    const { accessToken } = res.json()\r

      \    pm.collectionVariables.set('token', accessToken)\r

      \    pm.collectionVariables.set('tokenExpiry', Date.now() + 13 * 60 * 1000)\r

      \  })\r

      }\r\n"
