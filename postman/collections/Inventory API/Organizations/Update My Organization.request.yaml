$kind: http-request
name: Update My Organization
method: PATCH
url: '{{baseUrl}}/api/organizations/me'
order: 1001
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{accessToken}}'
body:
  type: json
  content: |-
    {
      "name": "My Updated Org Name"
    }
