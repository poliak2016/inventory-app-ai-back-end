$kind: http-request
method: POST
url: '{{baseUrl}}/api/stock/movements'
order: 4000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "productId": "{{productId}}",
      "type": "in",
      "quantity": 5,
      "note": "Stock replenishment"
    }
