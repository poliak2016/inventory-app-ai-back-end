$kind: http-request
method: GET
url: '{{baseUrl}}/api/stock/movements/{{productId}}/history'
order: 4001
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
params:
  - key: limit
    value: '20'
    disabled: true
  - key: offset
    value: '0'
    disabled: true
