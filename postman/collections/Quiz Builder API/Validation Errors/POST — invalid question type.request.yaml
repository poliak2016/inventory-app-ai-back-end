$kind: http-request
url: "{{baseUrl}}/quizzes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Bad Type Quiz",
      "questions": [
        { "text": "Some question", "type": "RADIO" }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('mentions invalid type', () => pm.expect(pm.response.json().message).to.include('invalid type'));
    language: text/javascript
order: 7000
