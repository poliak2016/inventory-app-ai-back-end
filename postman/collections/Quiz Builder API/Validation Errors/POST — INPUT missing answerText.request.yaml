$kind: http-request
url: "{{baseUrl}}/quizzes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Bad INPUT",
      "questions": [
        { "text": "What is 2+2?", "type": "INPUT" }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('mentions INPUT', () => pm.expect(pm.response.json().message).to.include('INPUT'));
    language: text/javascript
order: 4000
