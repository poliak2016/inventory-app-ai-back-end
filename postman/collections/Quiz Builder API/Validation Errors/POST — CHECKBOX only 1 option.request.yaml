$kind: http-request
url: "{{baseUrl}}/quizzes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Bad CHECKBOX",
      "questions": [
        {
          "text": "Pick one",
          "type": "CHECKBOX",
          "options": [
            { "text": "Only option", "isCorrect": true }
          ]
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('mentions CHECKBOX', () => pm.expect(pm.response.json().message).to.include('CHECKBOX'));
    language: text/javascript
order: 5000
