$kind: http-request
url: "{{baseUrl}}/quizzes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "questions": [
        { "text": "Some question", "type": "BOOLEAN", "correctBoolean": true }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('success false', () => pm.expect(pm.response.json().success).to.be.false);
    language: text/javascript
order: 1000
