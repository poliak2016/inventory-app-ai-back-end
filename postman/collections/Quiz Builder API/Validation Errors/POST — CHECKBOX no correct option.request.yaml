$kind: http-request
url: "{{baseUrl}}/quizzes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "No Correct CHECKBOX",
      "questions": [
        {
          "text": "Pick some",
          "type": "CHECKBOX",
          "options": [
            { "text": "Option A", "isCorrect": false },
            { "text": "Option B", "isCorrect": false }
          ]
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('mentions correct option', () => pm.expect(pm.response.json().message).to.include('correct'));
    language: text/javascript
order: 6000
