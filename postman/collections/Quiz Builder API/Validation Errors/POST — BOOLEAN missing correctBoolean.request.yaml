$kind: http-request
url: "{{baseUrl}}/quizzes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Bad BOOLEAN",
      "questions": [
        { "text": "True or false?", "type": "BOOLEAN" }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('mentions BOOLEAN', () => pm.expect(pm.response.json().message).to.include('BOOLEAN'));
    language: text/javascript
order: 3000
