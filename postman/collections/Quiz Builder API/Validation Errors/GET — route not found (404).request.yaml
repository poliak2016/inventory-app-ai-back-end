$kind: http-request
url: "{{baseUrl}}/unknown-route"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 404', () => pm.response.to.have.status(404));
      pm.test('not found message', () => pm.expect(pm.response.json().message).to.include('not found'));
    language: text/javascript
order: 10000
