$kind: http-request
name: POST /quizzes — BOOLEAN
description: Creates a quiz with two BOOLEAN questions. Saves `quizId` to collection variable.
url: "{{baseUrl}}/quizzes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Boolean Quiz",
      "questions": [
        {
          "text": "Is the sky blue?",
          "type": "BOOLEAN",
          "correctBoolean": true
        },
        {
          "text": "Is water dry?",
          "type": "BOOLEAN",
          "correctBoolean": false
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      if (json.data && json.data.id) {
        pm.collectionVariables.set('quizId', json.data.id);
        console.log('Saved quizId:', json.data.id);
      }
      pm.test('Status 201', () => pm.response.to.have.status(201));
      pm.test('success true', () => pm.expect(json.success).to.be.true);
      pm.test('has id', () => pm.expect(json.data.id).to.be.a('string'));
      pm.test('questions count', () => pm.expect(json.data.questions.length).to.equal(2));
    language: text/javascript
order: 1000
