$kind: http-request
name: GET /quizzes
description: "Returns summary list: id, title, numberOfQuestions, createdAt."
url: "{{baseUrl}}/quizzes"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('data is array', () => pm.expect(json.data).to.be.an('array'));
      pm.test('each item has numberOfQuestions', () => {
        json.data.forEach(q => pm.expect(q).to.have.property('numberOfQuestions'));
      });
      pm.test('no questions array in list', () => {
        json.data.forEach(q => pm.expect(q).to.not.have.property('questions'));
      });
    language: text/javascript
order: 5000
