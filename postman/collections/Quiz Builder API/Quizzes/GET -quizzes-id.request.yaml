$kind: http-request
name: GET /quizzes/:id
description: Returns full quiz with questions and nested options. Uses `quizId` saved from POST.
url: "{{baseUrl}}/quizzes/{{quizId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('has questions array', () => pm.expect(json.data.questions).to.be.an('array'));
      pm.test('questions have options', () => {
        json.data.questions.forEach(q => pm.expect(q).to.have.property('options'));
      });
    language: text/javascript
order: 6000
