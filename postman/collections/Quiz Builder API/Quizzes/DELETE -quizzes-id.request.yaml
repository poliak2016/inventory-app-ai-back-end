$kind: http-request
name: DELETE /quizzes/:id
description: Deletes the quiz saved in `quizId`. Cascade deletes all questions and options.
url: "{{baseUrl}}/quizzes/{{quizId}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('success message', () => pm.expect(json.message).to.equal('Quiz deleted successfully'));
    language: text/javascript
order: 7000
