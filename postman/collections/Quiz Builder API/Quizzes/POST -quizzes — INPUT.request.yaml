$kind: http-request
name: POST /quizzes — INPUT
description: Creates a quiz with one INPUT question.
url: "{{baseUrl}}/quizzes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Input Quiz",
      "questions": [
        {
          "text": "What is the capital of France?",
          "type": "INPUT",
          "answerText": "Paris"
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      pm.test('Status 201', () => pm.response.to.have.status(201));
      pm.test('question type INPUT', () => pm.expect(json.data.questions[0].type).to.equal('INPUT'));
      pm.test('answerText set', () => pm.expect(json.data.questions[0].answerText).to.equal('Paris'));
    language: text/javascript
order: 2000
