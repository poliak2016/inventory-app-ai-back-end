$kind: http-request
name: POST /quizzes — Mixed (all 3 types)
description: Creates a quiz with one question of each type.
url: "{{baseUrl}}/quizzes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Mixed Quiz",
      "questions": [
        {
          "text": "Is TypeScript a superset of JavaScript?",
          "type": "BOOLEAN",
          "correctBoolean": true
        },
        {
          "text": "Who created Linux?",
          "type": "INPUT",
          "answerText": "Linus Torvalds"
        },
        {
          "text": "Which are JavaScript frameworks?",
          "type": "CHECKBOX",
          "options": [
            { "text": "React",  "isCorrect": true  },
            { "text": "Vue",    "isCorrect": true  },
            { "text": "Django", "isCorrect": false },
            { "text": "Rails",  "isCorrect": false }
          ]
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      pm.test('Status 201', () => pm.response.to.have.status(201));
      pm.test('3 questions', () => pm.expect(json.data.questions.length).to.equal(3));
    language: text/javascript
order: 4000
