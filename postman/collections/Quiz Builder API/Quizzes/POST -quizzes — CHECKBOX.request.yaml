$kind: http-request
name: POST /quizzes — CHECKBOX
description: Creates a quiz with one CHECKBOX question with 4 options (2 correct).
url: "{{baseUrl}}/quizzes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Checkbox Quiz",
      "questions": [
        {
          "text": "Which are primary colours?",
          "type": "CHECKBOX",
          "options": [
            { "text": "Red",    "isCorrect": true  },
            { "text": "Green",  "isCorrect": false },
            { "text": "Blue",   "isCorrect": true  },
            { "text": "Yellow", "isCorrect": false }
          ]
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      pm.test('Status 201', () => pm.response.to.have.status(201));
      pm.test('has 4 options', () => pm.expect(json.data.questions[0].options.length).to.equal(4));
      const correct = json.data.questions[0].options.filter(o => o.isCorrect);
      pm.test('2 correct options', () => pm.expect(correct.length).to.equal(2));
    language: text/javascript
order: 3000
