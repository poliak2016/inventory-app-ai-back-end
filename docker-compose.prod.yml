name: docker-compose.prod.yml
services:

  redis:
    image: redis:7-alpine
    healthcheck: 
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  db:
    image: postgres:16
    env_file:
      - .env.docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_app"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: 
      context: .
      target: prod
    ports: 
      - 3000:3000 
    env_file:
      - .env.prod
      - .env.docker
    environment:
      NODE_ENV: production
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: 
      npm run start
   

volumes:
  postgres_data:
