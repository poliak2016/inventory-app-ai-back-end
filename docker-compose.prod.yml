name: inventory-app-prod

services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      target: prod
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env.prod
      - .env.docker
    environment:
      NODE_ENV: production
      DB_HOST: db
      REDIS_URL: redis://redis:6379
      LOAD_DOTENV: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run start
    restart: unless-stopped
