services:
  db_test:
    image: postgres:16
    env_file:
      - .env.test.docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    command: npm run test:docker
    env_file:
      - .env.test.docker
    environment:
      NODE_ENV: test
      LOAD_DOTENV: "false"
    depends_on:
      db_test:
        condition: service_healthy
