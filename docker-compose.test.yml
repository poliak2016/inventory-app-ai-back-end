services:
  db_test:
    image: postgres:16
    env_file:
      - .env.docker.test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_app_test"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: 
      context: .
      target: test
    command: sh -c "npm run db:reset:test:docker && npm run migrate:test:docker && npm run test"
    env_file:
      - .env.docker.test
    environment:
      NODE_ENV: test
      DB_HOST: db_test
      LOAD_DOTENV: "false"
    depends_on:
      db_test:
        condition: service_healthy
