services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  db:
    ports:
      - "5433:5432"
    restart: unless-stopped

  migrations:
    build:
      context: .
      target: dev
    command: npm run migrate:up
    env_file:
      - .env.docker
    environment:
      LOAD_DOTENV: "false"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: dev
    env_file:
      - .env.docker
    environment:
      NODE_ENV: development
      DB_HOST: db
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    command: npm run dev
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    restart: "no"

volumes:
  node_modules:
